<header class="topbar">
    <a class="brand" href="#">
        <span class="brand-mark">
            <img src="assets/growth-graph.png" alt="">
        </span>
        <span class="brand-text">
            <span class="brand-title">Real-Time Utilities Monitoring</span>
            <span class="brand-sub">Kyocera Thailand · Factory utilities</span>
        </span>
    </a>

    <app-factory-bot class="bot"></app-factory-bot>

    <div class="actions">
        <div class="meter" [ngClass]="meterState()" title="Records stored for this page (limit 20,000)">
            <div class="meter-head">
                <span class="meter-label">Record buffer</span>
                <span class="meter-value tabular">{{percent}}%</span>
            </div>
            <div class="meter-track">
                <div class="meter-fill" [style.width.%]="meterWidth()"></div>
            </div>
        </div>

        <button class="icon-btn" type="button" (click)="openBackups()" title="Backups (daily files)"
            aria-label="Open backups">
            <span class="material-icons">history</span>
        </button>

        <button class="icon-btn" type="button" (click)="openModal(download)" title="Download records (Excel)"
            aria-label="Download records">
            <span class="material-icons">file_download</span>
        </button>

        <button class="icon-btn" type="button" (click)="toggleTheme()"
            [title]="theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'" aria-label="Toggle theme">
            <span class="material-icons">{{theme === 'dark' ? 'wb_sunny' : 'brightness_2'}}</span>
        </button>
    </div>
</header>


<ng-template #download>
    <h2 mat-dialog-title>Download records</h2>
    <div mat-dialog-content>
        <p class="dialog-hint">Exports the records currently in the {{kv | uppercase}} buffer to Excel. Older days are
            backed up automatically — open them from Backups.</p>
        <mat-form-field class="dialog-field" appearance="outline">
            <mat-label>Password</mat-label>
            <input matInput type="password" [(ngModel)]="password">
        </mat-form-field>
    </div>
    <div mat-dialog-actions align="end">
        <button mat-button matDialogClose>Cancel</button>
        <button mat-flat-button matDialogClose (click)="onDownload()">Download</button>
    </div>
</ng-template>
